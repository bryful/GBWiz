plugins { id 'com.android.application' }
android {
    namespace 'jp.gbwiz'
    compileSdk 35
    buildToolsVersion '36.0.0'
    ndkVersion '30.0.16248370'
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    defaultConfig {
        applicationId providers.gradleProperty('gbwizApplicationId').getOrElse('jp.gbwiz')
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '0.1.3'
        manifestPlaceholders = [appLabel: 'GBWiz']
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    buildTypes {
        debug {
            versionNameSuffix '-dev'
            manifestPlaceholders = [appLabel: 'GBWiz 開発版']
        }
        release {
            debuggable false
            minifyEnabled false
        }
    }
    externalNativeBuild { cmake { path '../../CMakeLists.txt'; version '4.1.2' } }
}
